  <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','sans-serif']}}}};</script>
  <style>
    *,*::before,*::after{box-sizing:border-box}
    html,body,#root{height:100%;margin:0}
    body{font-family:'Inter',-apple-system,sans-serif;background:#f1f5f9}
    .submenu{overflow:hidden;transition:max-height .28s cubic-bezier(.4,0,.2,1),opacity .22s ease}
    .submenu.open{max-height:240px;opacity:1}.submenu.closed{max-height:0;opacity:0}
    .chevron{transition:transform .25s cubic-bezier(.4,0,.2,1)}.chevron.rotated{transform:rotate(180deg)}
    .lift{transition:transform .2s ease,box-shadow .2s ease}
    .lift:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(14,165,233,.13),0 2px 8px rgba(0,0,0,.05)}
    @keyframes dot-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.78)}}
    .pulse{animation:dot-pulse 1.9s ease-in-out infinite}
    .bar{transition:width 1s cubic-bezier(.4,0,.2,1)}
    .g-text{background:linear-gradient(135deg,#0ea5e9 0%,#38bdf8 55%,#0284c7 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    ::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}
    .toggle-thumb{transition:left .2s ease}
    .tooltip-wrap:hover .tooltip-box{opacity:1;pointer-events:auto}
    .tooltip-box{opacity:0;pointer-events:none;transition:opacity .15s ease}
    @keyframes spin{to{transform:rotate(360deg)}}
    .spin{animation:spin 1s linear infinite}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .fade-in{animation:fadeIn .35s ease forwards}
  </style>
</head>

// ── Shared primitives ─────────────────────────────────────────────────
function StatusBadge({ status }) {
  const cfg = {
    running:{ bg:'bg-emerald-50',text:'text-emerald-700',border:'border-emerald-200',dot:'bg-emerald-500',label:'실행 중', pulse:true  },
    pending:{ bg:'bg-amber-50',  text:'text-amber-700',  border:'border-amber-200',  dot:'bg-amber-500',  label:'대기 중', pulse:false },
    stopped:{ bg:'bg-slate-50',  text:'text-slate-500',  border:'border-slate-200',  dot:'bg-slate-400',  label:'중지됨',  pulse:false },
    online: { bg:'bg-sky-50',    text:'text-sky-700',    border:'border-sky-200',    dot:'bg-sky-500',    label:'온라인',  pulse:true  },
    offline:{ bg:'bg-red-50',    text:'text-red-600',    border:'border-red-200',    dot:'bg-red-500',    label:'오프라인',pulse:false },
  };
  const c = cfg[status]??cfg.stopped;
  return (
    <span className={`inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium border ${c.bg} ${c.text} ${c.border}`}>
      <span className={`w-1.5 h-1.5 rounded-full flex-shrink-0 ${c.dot} ${c.pulse?'pulse':''}`}/>
      {c.label}
    </span>
  );
}
function ProgressBar({ value, gradient='from-sky-400 to-sky-500' }) {
  return (
    <div className="w-full h-2 bg-slate-100 rounded-full overflow-hidden">
      <div className={`h-full rounded-full bg-gradient-to-r ${gradient} bar`} style={{width:`${value}%`}}/>
    </div>
  );
}

    <div className="lift bg-white rounded-2xl p-6 border border-slate-100 shadow-sm flex flex-col gap-3 cursor-default">

        <div className={`w-11 h-11 rounded-xl flex items-center justify-center ${bgClass}`}>
          <Icon size={21} className={iconClass}/>
        </div>

// ── Form helpers ──────────────────────────────────────────────────────
const IC = "w-full px-4 py-3 rounded-xl border border-slate-200 text-sm text-slate-800 focus:outline-none focus:border-sky-400 focus:ring-2 focus:ring-sky-100 transition-all placeholder-slate-300 bg-white";
function FSection({ icon:Icon, title, children }) {
  return (
    <div className="bg-white rounded-2xl border border-slate-100 shadow-sm p-6 space-y-5">
      <h3 className="text-sm font-bold text-slate-700 flex items-center gap-2">
        <Icon size={15} className="text-sky-500"/>{title}
      </h3>
      {children}
    </div>
  );
}
function FField({ label, children, hint }) {
  return (
    <div>
      <label className="block text-xs font-semibold text-slate-600 mb-2">{label}</label>
      {children}
      {hint&&<p className="text-xs text-slate-400 mt-1.5">{hint}</p>}
    </div>
  );
}
function FSel({ value, onChange, opts }) {
  return (
    <select value={value} onChange={e=>onChange(e.target.value)} className={IC}>
      {opts.map(([v,l])=><option key={v} value={v}>{l}</option>)}
    </select>
  );
}

function NodeManageView({ onNavigate }) {
  const online    = NODES.filter(n=>n.status==='online');

          <StatCard icon={Server}     title="총 노드"      value={`${NODES.length}개`}  sub={`${online.length}개 온라인`}   bgClass="bg-sky-50"     iconClass="text-sky-500"/>

// ── App ───────────────────────────────────────────────────────────────
function App() {
  const [activeTab,         setActiveTab]         = useState('home');
  const [expanded,          setExpanded]          = useState({workload:false,share:false});
  const [workloads,         setWorkloads]         = useState(WORKLOADS_INIT);
  const [monitoringWorkload,setMonitoringWorkload] = useState(null);

  const toggleExpand = useCallback(id=>{ setExpanded(p=>({...p,[id]:!p[id]})); },[]);

  const navigate = useCallback(tab=>{
    setActiveTab(tab);
    setMonitoringWorkload(null);
    if(tab.startsWith('workload-')) setExpanded(p=>({...p,workload:true}));
    if(tab.startsWith('share-'))    setExpanded(p=>({...p,share:true}));
  },[]);

  const addWorkload = useCallback(w=>{ setWorkloads(p=>[...p,w]); },[]);

  const view = ()=>{
    switch(activeTab){
      case 'home':
        return <HomeView onNavigate={navigate} workloads={workloads}/>;
      case 'workload-manage':
        if(monitoringWorkload)
          return <WorkloadMonitorView workload={monitoringWorkload} onBack={()=>setMonitoringWorkload(null)}/>;
        return <WorkloadManageView onNavigate={navigate} workloads={workloads} onSelectWorkload={setMonitoringWorkload}/>;
      case 'workload-create':
        return <WorkloadCreateView onNavigate={navigate} onCreateWorkload={addWorkload}/>;
      case 'share-manage':
        return <NodeManageView onNavigate={navigate}/>;
      case 'share-create':
        return <NodeCreateView onNavigate={navigate}/>;
      case 'community':
        return <PlaceholderView icon={Users}    title="커뮤니티" desc="커뮤니티 기능을 준비 중입니다"/>;
      case 'settings':
        return <PlaceholderView icon={Settings} title="설정"     desc="설정 페이지를 준비 중입니다"/>;
      case 'profile':
        return <PlaceholderView icon={User}     title="프로필"   desc="프로필 페이지를 준비 중입니다"/>;
      default:
        return <HomeView onNavigate={navigate} workloads={workloads}/>;
    }
  };

  return (
    <div style={{display:'flex',height:'100vh',overflow:'hidden'}}>
      <Sidebar activeTab={activeTab} onSelect={navigate} expanded={expanded} onToggle={toggleExpand}/>
      {view()}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
